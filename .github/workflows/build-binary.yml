name: Build binary

# Builds the Phi.Tui self-contained executable for a specific RID and
# uploads it as a workflow artifact. Used for the Termux (Android via
# proot) prototype: GitHub-hosted ARM64 runners have a small pool and
# routinely queue for tens of minutes, so we cross-build from x64 instead.
#
# Triggers:
#   - push tag matching `v*`          (release candidate)
#   - manual dispatch                  (ad-hoc validation builds)
#
# NOT wired into the normal CI flow (ci.yml): the normal pipeline tests
# code quality and runs the test suite; this pipeline produces an 80+ MB
# binary, which would slow every PR check. Keep them separate.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-arm64:
    name: Build Phi.Tui linux-arm64 (self-contained)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install arm64 cross-toolchain
        # NativeAOT cross-build from x64 to arm64 needs an aarch64 binutils and
        # a compatible clang. We disable NativeAOT (-p:PublishAot=false) and
        # ship a self-contained build instead — bundles the .NET runtime so
        # Termux only needs glibc and libssl, which Termux provides.
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Restore
        run: dotnet restore

      - name: Publish (self-contained, linux-arm64, no AOT)
        # PublishAot=true is set in Phi.Tui.csproj; we override it off here
        # because cross-arch NativeAOT needs target linkers that GitHub's
        # ubuntu-latest runner doesn't ship with.
        # Self-contained packs the .NET runtime + app into the directory.
        run: >-
          dotnet publish src/Phi.Tui/Phi.Tui.csproj
          -c Release
          -r linux-arm64
          -p:PublishAot=false
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -o publish/linux-arm64

      - name: Verify binary shape
        run: |
          file publish/linux-arm64/phi
          ls -lh publish/linux-arm64/phi

      - name: Package as tarball
        run: |
          cd publish
          tar -czf ../phi-linux-arm64.tar.gz linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phi-linux-arm64
          path: phi-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
