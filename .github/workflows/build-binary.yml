name: Build binary

# Builds the Phi.Tui self-contained native executable for a specific RID
# and uploads it as a workflow artifact. Used for the Termux (Android via
# proot) prototype: GitHub's `ubuntu-22.04-arm64` runner builds a linux-arm64
# binary directly without cross-compile toolchain pain.
#
# Triggers:
#   - push tag matching `v*`           (release candidate)
#   - manual dispatch (workflow_dispatch) for ad-hoc validation builds
#
# NOT wired into the normal CI flow (ci.yml): the normal pipeline tests
# code quality and runs the test suite; this pipeline produces a 80+ MB
# binary, which would slow every PR check. Keep them separate.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-arm64:
    name: Build linux-arm64 NativeAOT
    runs-on: ubuntu-22.04-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish (NativeAOT, linux-arm64, self-contained)
        # PublishSingleFile bundles the .NET runtime + app into one binary
        # that runs on Termux without a separate dotnet install.
        # Phi.Tui.csproj sets <PublishAot>true</PublishAot> by default; this
        # honors it and emits a single statically-linked native executable.
        run: >-
          dotnet publish src/Phi.Tui/Phi.Tui.csproj
          -c Release
          -r linux-arm64
          -p:PublishAot=true
          -p:PublishSingleFile=true
          -o publish/linux-arm64

      - name: Verify binary shape
        run: |
          file publish/linux-arm64/phi
          ldd publish/linux-arm64/phi || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phi-tui-linux-arm64
          path: publish/linux-arm64/phi
          if-no-files-found: error
          retention-days: 14
