name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Build DocFX site
        run: dotnet docfx build website/docfx.json

      - name: Verify _site exists
        run: |
          test -d website/_site || (echo "::error::website/_site not produced by docfx"; ls -la website; exit 1)
          ls website/_site | head -5

      - name: Write CNAME for custom domain
        run: echo 'phi.154839.xyz' > website/_site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5