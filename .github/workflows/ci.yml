name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Style check, build, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors turns every analyzer warning (CA1305, IDE0005,
      # CS1574, etc.) into a build failure. Combined with EnforceCodeStyleInBuild
      # in Directory.Build.props, this is the project's "style check": any
      # deviation from the configured rules fails the push.
      - name: Build (warnings as errors)
        run: dotnet build -c Release --no-restore /p:TreatWarningsAsErrors=true

      # TUnit's built-in Microsoft.Testing.Extensions.CodeCoverage writes
      # one coverage report per test project under TestResults/. Pass the
      # solution explicitly so `dotnet test` doesn't fall back to cwd
      # scanning (which silently skips projects on a fresh checkout).
      - name: Test + coverage
        run: |
          dotnet test phi.slnx -c Release --no-build -- --coverage --coverage-output-format cobertura
          echo '=== cobertura reports ==='
          find TestResults -name '*.cobertura.xml'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./TestResults/*.cobertura.xml
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}